{% extends 'base.html' %}{% block content %}<h2>Laporan Data Pasien</h2>{% if error %}<div class='alert alert-warning'>{{error}}</div>{% endif %}<div class='card p-3 table-responsive'><table class='table'><tr><th>No RM</th><th>Nama</th><th>JK</th><th>Telepon</th><th>Asuransi</th></tr>{% for r in rows %}<tr><td>{{r.no_rm}}</td><td>{{r.nama_lengkap}}</td><td>{{r.jenis_kelamin}}</td><td>{{r.no_telepon}}</td><td>{{r.nama_asuransi}}</td></tr>{% else %}<tr><td colspan='5'>Belum ada data.</td></tr>{% endfor %}</table></div>{% endblock %}
